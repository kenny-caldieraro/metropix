<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Télécharger Metropix</title>
<meta name="robots" content="noindex">
<style>
body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #141726; color: #f0ead8;
  font: 400 1.05rem/1.5 system-ui, sans-serif; text-align: center; padding: 24px; }
img.icone { width: 96px; border-radius: 22%; margin: 0 auto 16px; display: block; }
.stores { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
.stores img { height: 54px; }
a { color: #ffd27f; }
</style>
<script>
// envoie directement vers le bon store selon le téléphone
const ua = navigator.userAgent || "";
const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
if (ios) location.replace("https://apps.apple.com/app/id6831504134");
else if (/Android/.test(ua)) location.replace("https://play.google.com/store/apps/details?id=com.kennycaldieraro.metropix");
</script>
</head>
<body>
<main>
  <img class="icone" src="icon.png" alt="">
  <h1 style="margin:0">Metropix</h1>
  <p>Choisissez votre store · Choose your store</p>
  <div class="stores">
    <a href="https://apps.apple.com/app/id6831504134"><img src="img/appstore_fr.svg" alt="Télécharger dans l'App Store"></a>
    <a href="https://play.google.com/store/apps/details?id=com.kennycaldieraro.metropix"><img src="img/googleplay_fr.png" alt="Disponible sur Google Play"></a>
  </div>
  <p><a href="./">metropix</a></p>
</main>
</body>
</html>
